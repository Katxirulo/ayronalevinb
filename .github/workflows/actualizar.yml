name: Actualizar resultados desde Web

on:
  schedule:
    # Sábados de 10:00 a 18:00 cada hora (en UTC: 09:00 a 17:00)
    - cron: '0 9-17 * * 6'
    # Domingos de 10:00 a 14:00 cada hora (en UTC: 09:00 a 13:00)
    - cron: '0 9-13 * * 0'
    # De lunes a viernes a las 20:00 (19:00 UTC): recoge los horarios de la próxima jornada
    - cron: '0 19 * * 1-5'
  workflow_dispatch:     # Permite mantener el botón de ejecución manual por si lo necesitas

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "Actualizar resultados y actas de partidos"
          git push
