name: Actualizar resultados desde Web

on:
  schedule:
    # GitHub retrasa o descarta ejecuciones programadas en punto (minuto 0), por eso se usan minutos "raros".
    # Sábados de 9:17 a 18:47, dos veces por hora (UTC 08-17)
    - cron: '17,47 8-17 * * 6'
    # Domingos de 9:17 a 15:47, dos veces por hora (UTC 08-14)
    - cron: '17,47 8-14 * * 0'
    # De domingo a viernes a las 20:23 (19:23 UTC): horarios de la próxima jornada y actas corregidas
    - cron: '23 19 * * 0-5'
  workflow_dispatch:     # botón de ejecución manual

permissions:
  contents: write

# solo una ejecución a la vez: si hay una en marcha (en bucle), las programadas esperan en vez de pisarla
concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # un día de partidos completo (máximo de GitHub: 360)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Actualizar (y repetir cada 20 min mientras queden partidos de hoy sin resultado)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for vuelta in $(seq 1 15); do
            echo "::group::Vuelta $vuelta ($(TZ=Europe/Madrid date +%H:%M))"
            python scripts/actualizar.py || echo "El script ha fallado en esta vuelta; se sigue."
            git add index.html data/
            if ! git diff --cached --quiet; then
              git commit -m "Actualizar resultados y actas de partidos"
              git pull --rebase --autostash && git push
            fi
            echo "::endgroup::"
            python scripts/quedan_hoy.py || break
            echo "Nueva vuelta en 20 minutos..."
            sleep 1200
          done
